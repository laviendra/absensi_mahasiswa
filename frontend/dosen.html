<!DOCTYPE html>
<html>
<head>
    <title>Portal Dosen</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Portal Dosen</span>
        <button onclick="logoutDosen()" class="btn btn-danger">Logout</button>
    </div>
</nav>

<div class="container mt-4">

    <div id="areaJadwal">

        <h4>Jadwal Mengajar Saya</h4>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>Hari</th>
                    <th>Jam</th>
                    <th>Mata Kuliah</th>
                    <th>Kelas</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="dataJadwal"></tbody>

        </table>

    </div>


    <div id="areaAbsensi" class="d-none">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h4 class="mb-0">Absensi Pertemuan Hari Ini</h4>

            <div>
                <button class="btn btn-secondary me-2" onclick="kembaliKeJadwal()">Kembali</button>
                <button class="btn btn-danger" onclick="tutupPertemuan()">Tutup Pertemuan</button>
            </div>

        </div>

        <p class="text-muted small">Status kehadiran otomatis tersimpan begitu kamu ganti pilihannya.</p>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Jam Hadir</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="dataAbsensiKelas"></tbody>

        </table>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/dosen.js"></script>

</body>
</html>
