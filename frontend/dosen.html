<!DOCTYPE html>
<html>
<head>
    <title>Portal Dosen</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Portal Dosen</span>
        <button id="btnLogout" class="btn btn-danger d-none" onclick="logoutDosen()">Logout</button>
    </div>
</nav>

<div class="container mt-4">

    <div id="areaLogin">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body">

                        <h4 class="mb-3 text-center">Login Dosen</h4>

                        <input id="username" class="form-control mb-2" placeholder="Username">

                        <input id="password" type="password" class="form-control mb-3" placeholder="Password">

                        <button class="btn btn-primary w-100" onclick="loginDosen()">Login</button>

                        <p id="pesanLogin" class="text-danger mt-2 text-center"></p>

                        <p 
                        id="message"
                        class="text-danger mt-3 text-center">
                        </p>

                        <p class="text-center mt-2">
                            <a href="index.html" class="text-decoration-none small">Login sebagai Admin &rarr;</a>
                        </p>


                    </div>

                </div>

            </div>

        </div>

    </div>


    <div id="areaJadwal" class="d-none">

        <h4>Jadwal Mengajar Saya</h4>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>Hari</th>
                    <th>Jam</th>
                    <th>Mata Kuliah</th>
                    <th>Kelas</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="dataJadwal"></tbody>

        </table>

    </div>


    <div id="areaAbsensi" class="d-none">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h4 class="mb-0">Absensi Pertemuan Hari Ini</h4>

            <div>
                <button class="btn btn-secondary me-2" onclick="kembaliKeJadwal()">Kembali</button>
                <button class="btn btn-danger" onclick="tutupPertemuan()">Tutup Pertemuan</button>
            </div>

        </div>

        <p class="text-muted small">Status kehadiran otomatis tersimpan begitu kamu ganti pilihannya.</p>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Jam Hadir</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="dataAbsensiKelas"></tbody>

        </table>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/dosen.js"></script>

</body>
</html>
