<!DOCTYPE html>
<html>
<head>
    <title>Login Admin</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">
    <div class="row justify-content-center mt-5">

        <div class="col-md-4">

            <div class="card shadow login-card">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        Login Admin
                    </h3>


                    <div class="mb-3">
                        <label>
                            Username
                        </label>

                        <input 
                            type="text" 
                            id="username"
                            class="form-control">
                    </div>


                    <div class="mb-3">
                        <label>
                            Password
                        </label>

                        <input 
                            type="password" 
                            id="password"
                            class="form-control">
                    </div>


                    <button 
                        onclick="login()"
                        class="btn btn-primary w-100">
                        Login
                    </button>


                    <p 
                        id="message"
                        class="text-danger mt-3 text-center">
                    </p>

                    <p class="text-center mt-2">
                        <a href="dosen.html" class="text-decoration-none small">Login sebagai Dosen &rarr;</a>
                    </p>


                </div>

            </div>

        </div>

    </div>
</div>


<script src="js/login.js"></script>

</body>
</html>
