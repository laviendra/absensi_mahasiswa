<!DOCTYPE html>
<html>

<head>
    <title>Data Mahasiswa</title>

    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand">
Absensi Mahasiswa
</a>

<a href="dashboard.html" class="btn btn-secondary">
Dashboard
</a>

</div>

</nav>



<div class="container mt-4">


<h2>
Data Mahasiswa
</h2>

<div class="d-flex justify-content-between align-items-center mb-3">

<button 
class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#modalMahasiswa"
onclick="bukaModalTambah()">
+ Tambah Mahasiswa
</button>

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
id="tampilkanSemua"
onchange="loadMahasiswa()">

<label class="form-check-label" for="tampilkanSemua">
Tampilkan yang nonaktif juga
</label>

</div>

</div>

<table class="table table-bordered mt-3">


<thead class="table-dark">

<tr>

<th>No</th>
<th>Nama</th>
<th>Kelas</th>
<th>Jurusan</th>
<th>Status</th>
<th>Aksi</th>

</tr>

</thead>


<tbody id="dataMahasiswa">

</tbody>

</table>

</div>

<div class="modal fade" id="modalMahasiswa">

<div class="modal-dialog">

<div class="modal-content">


<div class="modal-header">
<h5 class="modal-title">
Tambah Mahasiswa
</h5>
</div>


<div class="modal-body">

<input 
type="hidden"
id="idMahasiswa">

<input 
id="nama"
class="form-control mb-2"
placeholder="Nama">


<select
id="kelas"
class="form-select mb-2">
<option value="">Pilih Kelas</option>
</select>


</div>


<div class="modal-footer">

<button 
class="btn btn-primary"
onclick="simpanMahasiswa()">
Simpan
</button>

</div>


</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/mahasiswa.js"></script>



</body>
</html>
