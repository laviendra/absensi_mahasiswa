<!DOCTYPE html>
<html>

<head>
    <title>Data Master</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="d-flex">

    <div class="sidebar text-white p-3 d-flex flex-column">

        <div class="brand mb-4">Absensi Mahasiswa</div>

        <ul class="nav nav-pills flex-column gap-1 flex-grow-1">

            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
            </li>

            <li class="nav-item">
                <a href="mahasiswa.html" class="nav-link">Mahasiswa</a>
            </li>

            <li class="nav-item">
                <a href="data-master.html" class="nav-link active">Data Master</a>
            </li>

            <li class="nav-item">
                <a href="absensi.html" class="nav-link">Absensi</a>
            </li>

        </ul>

        <button onclick="logout()" class="btn btn-outline-light btn-sm mt-3">Logout</button>

    </div>


    <div class="main-content p-4">

    <h2 class="mb-3">Data Master</h2>

    <ul class="nav nav-tabs" id="tabMaster">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabJurusan">Jurusan</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabKelas">Kelas</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabDosen">Dosen</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabMatkul">Mata Kuliah</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabJadwal">Jadwal</button>
        </li>
    </ul>

    <div class="tab-content bg-white border border-top-0 p-3">

        <!-- JURUSAN -->
        <div class="tab-pane fade show active" id="tabJurusan">

            <button class="btn btn-primary btn-sm mb-3" onclick="bukaModalJurusan()">+ Tambah Jurusan</button>

            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr><th>No</th><th>Nama Jurusan</th><th>Aksi</th></tr>
                </thead>
                <tbody id="dataJurusan"></tbody>
            </table>

        </div>

        <!-- KELAS -->
        <div class="tab-pane fade" id="tabKelas">

            <button class="btn btn-primary btn-sm mb-3" onclick="bukaModalKelas()">+ Tambah Kelas</button>

            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr><th>No</th><th>Nama Kelas</th><th>Jurusan</th><th>Aksi</th></tr>
                </thead>
                <tbody id="dataKelas"></tbody>
            </table>

        </div>

        <!-- DOSEN -->
        <div class="tab-pane fade" id="tabDosen">

            <button class="btn btn-primary btn-sm mb-3" onclick="bukaModalDosen()">+ Tambah Dosen</button>

            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr><th>No</th><th>Nama</th><th>Username</th><th>Aksi</th></tr>
                </thead>
                <tbody id="dataDosen"></tbody>
            </table>

        </div>

        <!-- MATA KULIAH -->
        <div class="tab-pane fade" id="tabMatkul">

            <button class="btn btn-primary btn-sm mb-3" onclick="bukaModalMatkul()">+ Tambah Mata Kuliah</button>

            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr><th>No</th><th>Kode</th><th>Nama Mata Kuliah</th><th>Aksi</th></tr>
                </thead>
                <tbody id="dataMatkul"></tbody>
            </table>

        </div>

        <!-- JADWAL -->
        <div class="tab-pane fade" id="tabJadwal">

            <button class="btn btn-primary btn-sm mb-3" onclick="bukaModalJadwal()">+ Tambah Jadwal</button>

            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr><th>No</th><th>Hari</th><th>Jam</th><th>Dosen</th><th>Mata Kuliah</th><th>Kelas</th><th>Aksi</th></tr>
                </thead>
                <tbody id="dataJadwal"></tbody>
            </table>

        </div>

    </div>

    </div>

</div>


<!-- MODAL JURUSAN -->
<div class="modal fade" id="modalJurusan">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Jurusan</h5></div>
            <div class="modal-body">
                <input type="hidden" id="idJurusan">
                <input id="namaJurusan" class="form-control" placeholder="Nama Jurusan">
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="simpanJurusan()">Simpan</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL KELAS -->
<div class="modal fade" id="modalKelas">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Kelas</h5></div>
            <div class="modal-body">
                <input type="hidden" id="idKelas">
                <input id="namaKelas" class="form-control mb-2" placeholder="Nama Kelas (misal: TI-3A)">
                <select id="jurusanKelas" class="form-select">
                    <option value="">Pilih Jurusan</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="simpanKelas()">Simpan</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DOSEN -->
<div class="modal fade" id="modalDosen">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Dosen</h5></div>
            <div class="modal-body">
                <input type="hidden" id="idDosen">
                <input id="namaDosen" class="form-control mb-2" placeholder="Nama Dosen">
                <input id="usernameDosen" class="form-control mb-2" placeholder="Username">
                <input id="passwordDosen" type="password" class="form-control" placeholder="Password (kosongkan kalau tidak diganti)">
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="simpanDosen()">Simpan</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL MATA KULIAH -->
<div class="modal fade" id="modalMatkul">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Mata Kuliah</h5></div>
            <div class="modal-body">
                <input type="hidden" id="idMatkul">
                <input id="kodeMatkul" class="form-control mb-2" placeholder="Kode (misal: IF301)">
                <input id="namaMatkul" class="form-control" placeholder="Nama Mata Kuliah">
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="simpanMatkul()">Simpan</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL JADWAL -->
<div class="modal fade" id="modalJadwal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Tambah Jadwal</h5></div>
            <div class="modal-body">
                <select id="dosenJadwal" class="form-select mb-2">
                    <option value="">Pilih Dosen</option>
                </select>
                <select id="matkulJadwal" class="form-select mb-2">
                    <option value="">Pilih Mata Kuliah</option>
                </select>
                <select id="kelasJadwal" class="form-select mb-2">
                    <option value="">Pilih Kelas</option>
                </select>
                <select id="hariJadwal" class="form-select mb-2">
                    <option value="">Pilih Hari</option>
                    <option>Senin</option>
                    <option>Selasa</option>
                    <option>Rabu</option>
                    <option>Kamis</option>
                    <option>Jumat</option>
                    <option>Sabtu</option>
                </select>
                <input id="jamJadwal" type="time" class="form-control">
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="simpanJadwal()">Simpan</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/data-master.js"></script>

</body>
</html>
