<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Admin</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>


<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            Absensi Mahasiswa
        </span>

        <div>

            <a href="mahasiswa.html" class="btn btn-light me-2">
                Mahasiswa
            </a>

            <a href="absensi.html" class="btn btn-primary me-2">
                Absensi
            </a>

            <button 
                onclick="logout()"
                class="btn btn-danger">
                Logout
            </button>

        </div>

    </div>
</nav>



<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">
            Dashboard
        </h2>

        <span id="tanggalHariIni" class="text-muted"></span>

    </div>


    <div class="row g-3">


        <div class="col-md-3">

            <div class="card text-bg-primary shadow-sm h-100">

                <div class="card-body text-center">

                    <h6 class="card-title text-uppercase mb-2">
                        Total Mahasiswa
                    </h6>

                    <h2 id="totalMahasiswa" class="mb-0">
                        0
                    </h2>

                </div>

            </div>

        </div>



        <div class="col-md-3">

            <div class="card text-bg-success shadow-sm h-100">

                <div class="card-body text-center">

                    <h6 class="card-title text-uppercase mb-2">
                        Hadir Hari Ini
                    </h6>

                    <h2 id="hadir" class="mb-0">
                        0
                    </h2>

                </div>

            </div>

        </div>



        <div class="col-md-3">

            <div class="card text-bg-warning shadow-sm h-100">

                <div class="card-body text-center">

                    <h6 class="card-title text-uppercase mb-2">
                        Terlambat
                    </h6>

                    <h2 id="terlambat" class="mb-0">
                        0
                    </h2>

                </div>

            </div>

        </div>



        <div class="col-md-3">

            <div class="card text-bg-danger shadow-sm h-100">

                <div class="card-body text-center">

                    <h6 class="card-title text-uppercase mb-2">
                        Belum Absen
                    </h6>

                    <h2 id="belumAbsen" class="mb-0">
                        0
                    </h2>

                </div>

            </div>

        </div>


    </div>


</div>


<script src="js/dashboard.js"></script>

</body>
</html>
