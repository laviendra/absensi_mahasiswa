<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Admin</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="d-flex">

    <div class="sidebar text-white p-3 d-flex flex-column">

        <div class="brand mb-4">Absensi Mahasiswa</div>

        <ul class="nav nav-pills flex-column gap-1 flex-grow-1">

            <li class="nav-item">
                <a href="dashboard.html" class="nav-link active">Dashboard</a>
            </li>

            <li class="nav-item">
                <a href="mahasiswa.html" class="nav-link">Mahasiswa</a>
            </li>

            <li class="nav-item">
                <a href="data-master.html" class="nav-link">Data Master</a>
            </li>

            <li class="nav-item">
                <a href="rekap-kelas.html" class="nav-link">Rekap Kelas</a>
            </li>

        </ul>

        <button onclick="logout()" class="btn btn-outline-light btn-sm mt-3">Logout</button>

    </div>


    <div class="main-content p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="mb-0">Dashboard</h2>

            <span id="tanggalHariIni" class="text-muted"></span>

        </div>


        <div class="row g-3">


            <div class="col-md-3">

                <div class="card text-bg-primary shadow-sm h-100">

                    <div class="card-body text-center">

                        <h6 class="card-title text-uppercase mb-2">
                            Total Mahasiswa
                        </h6>

                        <h2 id="totalMahasiswa" class="mb-0">
                            0
                        </h2>

                    </div>

                </div>

            </div>



            <div class="col-md-3">

                <div class="card text-bg-success shadow-sm h-100">

                    <div class="card-body text-center">

                        <h6 class="card-title text-uppercase mb-2">
                            Total Dosen
                        </h6>

                        <h2 id="totalDosen" class="mb-0">
                            0
                        </h2>

                    </div>

                </div>

            </div>



            <div class="col-md-3">

                <div class="card text-bg-warning shadow-sm h-100">

                    <div class="card-body text-center">

                        <h6 class="card-title text-uppercase mb-2">
                            Total Kelas
                        </h6>

                        <h2 id="totalKelas" class="mb-0">
                            0
                        </h2>

                    </div>

                </div>

            </div>



            <div class="col-md-3">

                <div class="card text-bg-info shadow-sm h-100">

                    <div class="card-body text-center">

                        <h6 class="card-title text-uppercase mb-2">
                            Pertemuan Hari Ini
                        </h6>

                        <h2 id="pertemuanHariIni" class="mb-0">
                            0
                        </h2>

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>


<script src="js/layout.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
