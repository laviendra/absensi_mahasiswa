<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Admin</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>


<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">
            Absensi Mahasiswa
        </span>

        <button 
            onclick="logout()"
            class="btn btn-danger">
            Logout
        </button>

    </div>
</nav>



<div class="container mt-4">

    <h2>
        Dashboard
    </h2>


    <div class="row mt-4">


        <div class="col-md-3">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h5>Total Mahasiswa</h5>

                    <h2 id="totalMahasiswa">
                        0
                    </h2>

                </div>

            </div>

        </div>



        <div class="col-md-3">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h5>Hadir</h5>

                    <h2 id="hadir">
                        0
                    </h2>

                </div>

            </div>

        </div>



        <div class="col-md-3">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h5>Terlambat</h5>

                    <h2 id="terlambat">
                        0
                    </h2>

                </div>

            </div>

        </div>



        <div class="col-md-3">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h5>Belum Absen</h5>

                    <h2 id="belumAbsen">
                        0
                    </h2>

                </div>

            </div>

        </div>


    </div>


</div>


<script src="js/dashboard.js"></script>

</body>
</html>
