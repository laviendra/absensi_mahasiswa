<!DOCTYPE html>
<html>

<head>
    <title>Absensi Mahasiswa</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="d-flex">

    <div class="sidebar text-white p-3 d-flex flex-column">

        <div class="brand mb-4">Absensi Mahasiswa</div>

        <ul class="nav nav-pills flex-column gap-1 flex-grow-1">

            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
            </li>

            <li class="nav-item">
                <a href="mahasiswa.html" class="nav-link">Mahasiswa</a>
            </li>

            <li class="nav-item">
                <a href="data-master.html" class="nav-link">Data Master</a>
            </li>

            <li class="nav-item">
                <a href="absensi.html" class="nav-link active">Absensi</a>
            </li>

            <li class="nav-item">
                <a href="rekap-kelas.html" class="nav-link">Rekap Kelas</a>
            </li>

        </ul>

        <button onclick="logout()" class="btn btn-outline-light btn-sm mt-3">Logout</button>

    </div>


    <div class="main-content p-4">

    <h2>Data Absensi Harian</h2>

    <div class="row mb-3">

    <div class="col-md-3">

    <label class="form-label">Tanggal</label>

    <input
    id="tanggalFilter"
    type="date"
    class="form-control">

    </div>

    </div>

    <p class="text-muted small">
    Klik tombol <strong>Masuk</strong> pada baris mahasiswa masing-masing untuk mencatat kehadiran.
    </p>

    <table class="table table-bordered table-striped">

    <thead class="table-dark">

    <tr>

    <th style="width:60px;">No</th>
    <th>Nama</th>
    <th style="width:140px;">Jam Masuk</th>
    <th style="width:140px;">Status</th>
    <th style="width:130px;">Aksi</th>

    </tr>

    </thead>

    <tbody id="dataAbsensi">

    </tbody>

    </table>

    </div>

</div>

<script src="js/layout.js"></script>
<script src="js/absensi.js"></script>

</body>

</html>
