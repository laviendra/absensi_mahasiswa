<!DOCTYPE html>
<html>

<head>
    <title>Absensi Mahasiswa</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand">
Absensi Mahasiswa
</a>

<div>

<a href="dashboard.html" class="btn btn-light">
Dashboard
</a>

<a href="mahasiswa.html" class="btn btn-primary">
Mahasiswa
</a>

</div>

</div>

</nav>


<div class="container mt-4">

<h2>Data Absensi Harian</h2>

<div class="row mb-3 align-items-end">

<div class="col-md-3">

<label class="form-label">Tanggal</label>

<input
id="tanggalFilter"
type="date"
class="form-control">

</div>

<div class="col-md-4">

<label class="form-label">Mahasiswa</label>

<select
id="mahasiswa"
class="form-select">

</select>

</div>

<div class="col-md-3">

<button
class="btn btn-success w-100"
onclick="absenMasuk()">

Absen Masuk

</button>

</div>

</div>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>No</th>
<th>Nama</th>
<th>Jam Masuk</th>
<th>Jam Pulang</th>
<th>Status</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="dataAbsensi">

</tbody>

</table>

</div>

<script src="js/absensi.js"></script>

</body>

</html>
